<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 23 - Game kiểm tra tốc độ phản xạ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 16px;
            font-size: 24px;
        }

        .dashboard {
            width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }

        .stat-box {
            font-size: 18px;
            font-weight: 600;
            color: #334155;
        }

        .stat-box span {
            color: #2563eb;
            font-size: 22px;
            font-weight: bold;
        }

        #time-display {
            color: #dc2626;
        }

        #start-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #16a34a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #start-btn:hover:not(:disabled) {
            background-color: #15803d;
        }

        #start-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        #start-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Khu vực chơi kích thước chuẩn 600px x 400px */
        #arena {
            width: 600px;
            height: 400px;
            position: relative; /* Làm gốc tọa độ cho các phần tử absolute bên trong */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 4px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            user-select: none;
        }

        /* Mục tiêu hình tròn nhỏ định vị tuyệt đối */
        .target {
            width: 40px;
            height: 40px;
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #dc2626);
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: crosshair;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            transition: transform 0.08s ease;
        }

        .target:active {
            transform: scale(0.85);
        }

        /* Màn hình thông báo kết quả khi hết giờ */
        #result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.88);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            z-index: 10;
        }

        #result-overlay h2 {
            font-size: 32px;
            color: #facc15;
            margin-bottom: 10px;
        }

        #result-overlay p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        #result-overlay span {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
        }
    </style>
</head>
<body>

    <h1>🎯 Game Kiểm Tra Tốc Độ Phản Xạ</h1>

    <!-- Thanh hiển thị thông tin & nút điều khiển -->
    <div class="dashboard">
        <div class="stat-box">Điểm số: <span id="score-display">0</span></div>
        <div class="stat-box">Thời gian: <span id="time-display">30</span>s</div>
        <button id="start-btn">Bắt đầu trò chơi</button>
    </div>

    <!-- Khu vực chơi 600px x 400px -->
    <div id="arena">
        <div id="result-overlay">
            <h2>HẾT GIỜ!</h2>
            <p>Tổng số điểm đạt được: <span id="final-score">0</span></p>
        </div>
    </div>

    <script>
        const arena = document.getElementById('arena');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const resultOverlay = document.getElementById('result-overlay');
        const finalScore = document.getElementById('final-score');

        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let countdownTimer = null;
        let moveTimer = null;
        let currentTarget = null;

        const TARGET_SIZE = 40; // Kích thước đường kính mục tiêu (40px)

        // Hàm tạo tọa độ ngẫu nhiên và hiển thị mục tiêu
        function spawnTarget() {
            if (!isPlaying) return;

            // Xóa mục tiêu cũ nếu đang tồn tại
            if (currentTarget) {
                currentTarget.remove();
            }

            const target = document.createElement('div');
            target.classList.add('target');

            // Tính toán giới hạn tọa độ để mục tiêu không bị tràn ra ngoài khung 600x400
            const maxLeft = arena.clientWidth - TARGET_SIZE;
            const maxTop = arena.clientHeight - TARGET_SIZE;

            const randomLeft = Math.floor(Math.random() * maxLeft);
            const randomTop = Math.floor(Math.random() * maxTop);

            target.style.left = randomLeft + 'px';
            target.style.top = randomTop + 'px';

            // Sự kiện khi người dùng click trúng mục tiêu
            target.addEventListener('mousedown', function (e) {
                e.stopPropagation();
                if (!isPlaying) return;

                score++;
                scoreDisplay.textContent = score;

                // Đặt lại bộ đếm 1 giây và đổi vị trí mục tiêu ngay lập tức
                resetMoveInterval();
                spawnTarget();
            });

            arena.appendChild(target);
            currentTarget = target;
        }

        // Đặt lại chu kỳ tự động đổi vị trí mỗi 1 giây (1000ms)
        function resetMoveInterval() {
            clearInterval(moveTimer);
            moveTimer = setInterval(() => {
                spawnTarget();
            }, 1000);
        }

        // Hàm bắt đầu trò chơi
        function startGame() {
            // Reset các thông số
            score = 0;
            timeLeft = 30;
            isPlaying = true;

            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            resultOverlay.style.display = 'none';
            startBtn.disabled = true;
            startBtn.textContent = 'Đang chơi...';

            // Sinh mục tiêu đầu tiên và kích hoạt vòng lặp 1 giây
            spawnTarget();
            resetMoveInterval();

            // Bộ đếm ngược thời gian 30 giây
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // Hàm kết thúc trò chơi và khóa toàn bộ thao tác
        function endGame() {
            isPlaying = false;
            clearInterval(countdownTimer);
            clearInterval(moveTimer);

            // Xóa mục tiêu trên màn hình để khóa thao tác click
            if (currentTarget) {
                currentTarget.remove();
                currentTarget = null;
            }

            // Hiển thị bảng tổng kết điểm
            finalScore.textContent = score;
            resultOverlay.style.display = 'flex';

            // Mở lại nút Bắt đầu để có thể chơi lại
            startBtn.disabled = false;
            startBtn.textContent = 'Chơi lại';
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
